<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubScript IDE (.sub15) - v2.9.2 Pages & Place Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        .code-font { 
            font-family: 'Consolas', 'Fira Code', 'Courier New', monospace !important; 
            tab-size: 2 !important; 
            -moz-tab-size: 2 !important; 
            letter-spacing: 0px !important;
            word-spacing: 0px !important;
            font-variant-ligatures: none !important;
            font-feature-settings: "liga" 0 !important;
        }
        
        .token-keyword { color: #f472b6 !important; font-weight: normal !important; } 
        .token-string { color: #a3e635 !important; font-weight: normal !important; }  
        .token-variable { color: #38bdf8 !important; font-weight: normal !important; } 
        .token-css-prop { color: #fbbf24 !important; font-weight: normal !important; } 
        .token-css-val { color: #c084fc !important; font-weight: normal !important; }  
        .token-func { color: #fb7185 !important; font-weight: normal !important; }   
        .token-comment { color: #6b7280 !important; font-style: italic !important; font-weight: normal !important; }
        .token-bracket { color: #94a3b8 !important; font-weight: normal !important; }  
        .token-operator { color: #f97316 !important; font-weight: normal !important; } 
        .token-attr { color: #2dd4bf !important; font-weight: normal !important; }     
        .token-dot-style { color: #e879f9 !important; font-weight: normal !important; } 
        .token-ninfa { color: #ec4899 !important; font-weight: normal !important; }     
        .token-route { color: #f59e0b !important; font-weight: normal !important; }     

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

        #lineNumbers {
            font-family: 'Consolas', 'Fira Code', 'Courier New', monospace !important;
            font-size: 14px !important;
            line-height: 22px !important;
            padding: 12px 12px 12px 8px !important;
            user-select: none;
            box-sizing: border-box !important;
            letter-spacing: 0px !important;
        }

        #highlighting, #editing {
            margin: 0 !important;
            padding: 12px !important;
            border: 0 !important;
            width: 100% !important;
            height: 100% !important;
            font-family: 'Consolas', 'Fira Code', 'Courier New', monospace !important;
            font-size: 14px !important;
            line-height: 22px !important;
            box-sizing: border-box !important;
            white-space: pre !important;
            tab-size: 2 !important;
            -moz-tab-size: 2 !important;
            letter-spacing: 0px !important;
            word-spacing: 0px !important;
            font-variant-ligatures: none !important;
            font-feature-settings: "liga" 0 !important;
            font-weight: 400 !important;
        }

        #editing {
            color: transparent !important;
            -webkit-text-fill-color: transparent !important;
            background: transparent !important;
            caret-color: #f59e0b !important;
            z-index: 2;
            resize: none !important;
            outline: none !important;
        }

        #highlighting {
            color: #f8fafc !important;
            z-index: 1;
            overflow: hidden !important;
            pointer-events: none !important;
        }

        #highlighting-content {
            font-family: inherit !important;
            font-size: inherit !important;
            line-height: inherit !important;
            padding: 0 !important;
            margin: 0 !important;
            letter-spacing: inherit !important;
            word-spacing: inherit !important;
            font-variant-ligatures: none !important;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col overflow-hidden">

    <header class="bg-slate-950 border-b border-slate-800 px-4 py-2 flex items-center justify-between select-none">
        <div class="flex items-center space-x-3">
            <div class="flex items-center space-x-2 bg-gradient-to-r from-amber-500 via-purple-600 to-indigo-600 px-3 py-1 rounded-lg text-white font-bold text-sm tracking-wide shadow-lg">
                <i class="fa-solid font-mono text-lg">&lt;/&gt;</i>
                <span>SubScript IDE</span>
                <span class="text-[10px] bg-black/30 px-1.5 py-0.5 rounded text-amber-200">v2.9.2</span>
            </div>
            <span id="currentFileName" class="text-xs text-slate-400 bg-slate-800/60 border border-slate-700/50 px-2.5 py-1 rounded-md flex items-center gap-1.5">
                <i class="fa-regular fa-file-code text-amber-400"></i>
                <span id="fileNameText">meu_projeto.sub15</span>
            </span>
        </div>

        <div class="flex items-center space-x-2">
            <input type="file" id="fileInput" accept=".sub15" class="hidden" onchange="handleFileOpen(event)">
            
            <button onclick="document.getElementById('fileInput').click()" class="px-2.5 py-1.5 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700 transition flex items-center gap-1.5">
                <i class="fa-solid fa-folder-open text-amber-400"></i> Abrir
            </button>

            <button onclick="saveFile()" class="px-2.5 py-1.5 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700 transition flex items-center gap-1.5">
                <i class="fa-solid fa-floppy-disk text-blue-400"></i> Salvar
            </button>

            <button onclick="saveFileAs()" class="px-2.5 py-1.5 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700 transition flex items-center gap-1.5">
                <i class="fa-solid fa-file-export text-indigo-400"></i> Salvar Como
            </button>

            <div class="h-4 w-[1px] bg-slate-800 mx-1"></div>

            <button onclick="exportToHTML()" class="px-3 py-1.5 text-xs font-medium bg-emerald-700 hover:bg-emerald-600 text-white rounded-lg transition shadow-md flex items-center gap-1.5">
                <i class="fa-brands fa-html5 text-amber-300"></i> Exportar HTML
            </button>
            
            <button onclick="compileAndRender()" class="px-3 py-1.5 text-xs font-semibold bg-amber-600 hover:bg-amber-500 text-white rounded-lg transition shadow-md flex items-center gap-1.5">

    </header>

    <div class="bg-slate-900/90 border-b border-slate-800 px-4 py-1 flex items-center gap-2 overflow-x-auto text-xs text-slate-400 select-none">
        <span class="text-[11px] text-slate-500 font-medium mr-1"><i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i> Snippets 2.9:</span>
        <button onclick="insertSnippet('pageParam')" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 rounded text-amber-300 border border-slate-700/60 transition">+ page = rota(param)</button>
        <button onclick="insertSnippet('popupSnippet')" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 rounded text-pink-300 border border-slate-700/60 transition">+ popup = nome</button>
        <button onclick="insertSnippet('onclickPlace')" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 rounded text-purple-300 border border-slate-700/60 transition">+ onclick.place</button>
        <button onclick="insertSnippet('constSnippet')" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 rounded text-emerald-300 border border-slate-700/60 transition">+ const = nometravado</button>
    </div>

    <div class="flex-1 flex overflow-hidden relative">
        <div class="w-1/2 border-r border-slate-800 flex flex-col bg-slate-950 relative">
            <div class="bg-slate-900/80 px-3 py-1 text-xs text-slate-400 border-b border-slate-800/80 flex justify-between items-center">
                <span class="flex items-center gap-1.5 font-medium text-slate-300">
                    <i class="fa-solid fa-code text-amber-400"></i> Código SubScript 2.9
                </span>
                <div class="flex items-center gap-3">
                    <span id="editorStats" class="text-[10px] text-slate-500 font-mono">Linha: 1 | Coluna: 1</span>
                    <button onclick="clearEditor()" class="text-[11px] text-slate-400 hover:text-rose-400 transition" title="Limpar Código"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            </div>

            <div class="relative flex-1 flex overflow-hidden code-font" id="editorContainer">
                <div id="lineNumbers" class="bg-slate-950 text-slate-600 text-right select-none border-r border-slate-800/60 min-w-[48px] overflow-hidden">1</div>
                <div class="relative flex-1 h-full overflow-hidden">
                    <pre id="highlighting" class="absolute top-0 left-0 pointer-events-none bg-transparent overflow-hidden" aria-hidden="true"><code id="highlighting-content"></code></pre>
                    <textarea id="editing" spellcheck="false" class="absolute top-0 left-0 resize-none outline-none overflow-auto" oninput="updateEditor()" onkeydown="handleKeyDown(event)" onclick="updateCursorStats()" onkeyup="updateCursorStats()"></textarea>
                </div>
                <div id="suggestionsBox" class="hidden absolute z-50 bg-slate-800 border border-slate-700 rounded-lg shadow-2xl max-h-60 w-80 overflow-y-auto text-xs code-font divide-y divide-slate-700/50"></div>
            </div>
        </div>

        <div class="w-1/2 flex flex-col bg-slate-900 relative">
            <div class="bg-slate-900/80 px-3 py-1 text-xs text-slate-400 border-b border-slate-800/80 flex justify-between items-center">
                <span class="flex items-center gap-1.5 font-medium text-slate-300">
                    <i class="fa-solid fa-eye text-emerald-400"></i> Renderização em Tempo Real (SubScript 2.9)
                </span>
                <div class="flex items-center gap-3">
                    <span id="statusIndicator" class="text-[11px] text-emerald-400 flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Compilado
                    </span>
                </div>
            </div>

            <div class="flex-1 bg-white relative">
                <iframe id="previewFrame" class="w-full h-full border-none bg-white"></iframe>
            </div>

            <div class="h-36 bg-slate-950 border-t border-slate-800 flex flex-col">
                <div class="bg-slate-900 px-3 py-1 text-[11px] text-slate-400 border-b border-slate-800 flex justify-between items-center">
                    <span class="font-semibold text-slate-300"><i class="fa-solid fa-terminal text-amber-400"></i> Console SubScript / Eventos</span>
                    <button onclick="clearConsole()" class="text-slate-500 hover:text-slate-300 text-[10px]">Limpar Console</button>
                </div>
                <div id="consoleOutput" class="p-2.5 code-font text-xs text-slate-300 overflow-y-auto flex-1 space-y-1">
                    <div class="text-slate-500 italic">// Saídas do console.log(), navegação e popups...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const initialCode = `head = {
  title = "Aplicação SubScript 2.9"
  meta = "charset=UTF-8"
}

page = inicio() {
  div [class="card"].style {
    background-color: #1e293b;
    padding: 24px;
    border-radius: 12px;
    max-width: 480px;
    margin: 20px auto;
    border: 1px solid #334155;
    font-family: sans-serif;
  } {
    h1 = "Painel Principal" {
      color: #f59e0b;
      margin-top: 0;
    }

    p = "Bem-vindo ao sistema de rotas e menus do SubScript 2.9." {
      color: #cbd5e1;
    }

    button = "Abrir Popup".style {
      background-color: #ec4899;
      color: white;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-right: 8px;
      onClick: SubScript.openPopup("confirmModal")
    }

    button = "Menu Opções".style {
      background-color: #3b82f6;
      color: white;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      onclick.place: {
        div.style {
          background-color: #0f172a;
          color: white;
          padding: 12px;
          border-radius: 8px;
          border: 1px solid #475569;
          box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        } {
          p = "👉 Ver Perfil de Carlos".style {
            margin: 0;
            padding: 8px;
            cursor: pointer;
            color: #38bdf8;
            onClick: SubScript.navigate("perfil", "Carlos Eduardo")
          }
        }
      }
    }
  }
}

page = perfil(usuario) {
  div [class="card"].style {
    background-color: #0f172a;
    padding: 24px;
    border-radius: 12px;
    max-width: 480px;
    margin: 20px auto;
    border: 1px solid #38bdf8;
    font-family: sans-serif;
  } {
    h2 = "Perfil do Usuário" {
      color: #38bdf8;
      margin-top: 0;
    }
    p = "Bem-vindo de volta, " + $usuario + "!" {
      color: #94a3b8;
    }
    button = "Voltar ao Início".style {
      background-color: #10b981;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      onClick: SubScript.navigate("inicio")
    }
  }
}

popup = confirmModal {
  div.style {
    text-align: center;
    font-family: sans-serif;
  } {
    h3 = "Confirmação" {
      color: #ec4899;
      margin-top: 0;
    }
    p = "Deseja realmente fechar esta janela?" {
      color: #cbd5e1;
    }
    button = "Fechar".style {
      background-color: #64748b;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      onClick: SubScript.closePopup("confirmModal")
    }
  }
}`;

        const autocompleteDictionary = [
            { label: 'page = rota(params)', type: 'rota', snippet: 'page = minhaRota(param) {\n  div {\n    h1 = "Página " + $param\n  }\n}', desc: 'Criação de Rota com Parâmetros' },
            { label: 'popup = nomePopup', type: 'rota', snippet: 'popup = meuModal {\n  div {\n    h2 = "Título do Modal"\n  }\n}', desc: 'Criação de Popup' },
            { label: 'onclick.place', type: 'rota', snippet: 'onclick.place: {\n  div {\n    p = "Item do Menu Flutuante"\n  }\n}', desc: 'Menu Suspenso Flutuante' },
            { label: 'SubScript.navigate(...)', type: 'func', snippet: 'SubScript.navigate("nomeRota", "param1")', desc: 'Navegar para Rota' },
            { label: 'SubScript.openPopup(...)', type: 'func', snippet: 'SubScript.openPopup("nomePopup")', desc: 'Abrir Popup' },
            { label: 'SubScript.closePopup(...)', type: 'func', snippet: 'SubScript.closePopup("nomePopup")', desc: 'Fechar Popup' }
        ];

        let currentFileName = "meu_projeto.sub15";
        let selectedSuggestionIndex = 0;
        let filteredSuggestions = [];

        const editing = document.getElementById('editing');
        const highlightingContent = document.getElementById('highlighting-content');
        const highlighting = document.getElementById('highlighting');
        const suggestionsBox = document.getElementById('suggestionsBox');
        const consoleOutput = document.getElementById('consoleOutput');
        const lineNumbers = document.getElementById('lineNumbers');

        window.onload = () => {
            editing.value = initialCode;
            updateEditor();
            compileAndRender();

            editing.addEventListener('scroll', () => {
                highlighting.scrollTop = editing.scrollTop;
                highlighting.scrollLeft = editing.scrollLeft;
                lineNumbers.scrollTop = editing.scrollTop;
            });
        };

        function escapeHTML(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function updateLineNumbers() {
            const lines = editing.value.split('\n').length;
            let numbersHtml = '';
            for (let i = 1; i <= lines; i++) { numbersHtml += i + '<br>'; }
            lineNumbers.innerHTML = numbersHtml;
        }

        function updateCursorStats() {
            const text = editing.value;
            const pos = editing.selectionStart;
            const lines = text.substring(0, pos).split('\n');
            const lineNum = lines.length;
            const colNum = lines[lines.length - 1].length + 1;
            document.getElementById('editorStats').innerText = `Linha: ${lineNum} | Coluna: ${colNum} | Total: ${text.length} chars`;
        }

        function updateEditor() {
            const code = editing.value;
            updateLineNumbers();
            
            const tokenRegex = new RegExp([
                '(\\/\/[^\\n]*)',
                '("(?:[^"\\\\]|\\\\.)*"|\'(?:[^\'\\\\]|\\\\.)*\')',
                '(\\$[a-zA-Z0-9_]+)',
                '(\\b(?:var|let|const|function|return|if|else)\\b)',
                '(\\bpage\\b|\\bpopup\\b|onclick\\.place)',
                '(\\b(?:head|style|h1|h2|h3|p|div|span|button|input)\\b)',
                '(\\b\\[[^\\]]*\\])',
                '(\\.style)',
                '(\\b(?:SubScript\\.navigate|SubScript\\.openPopup|SubScript\\.closePopup)\\b)',
                '(\\b(?:onClick|color|background-color|margin|padding|border|border-radius)\\b)',
                '(\\+)',
                '(#[0-9a-fA-F]{3,8}\\b|\\b\\d+(?:px|em|%)?\\b)',
                '([{}()=:;,])'
            ].join('|'), 'g');

            let highlighted = '';
            let lastIndex = 0;
            let match;

            while ((match = tokenRegex.exec(code)) !== null) {
                if (match.index > lastIndex) {
                    highlighted += escapeHTML(code.substring(lastIndex, match.index));
                }

                const [fullMatch, comment, str, variable, jsDecl, routeKw, tagKeyword, htmlAttrs, dotStyle, funcCall, propName, concatOp, cssVal, symbol] = match;

                if (comment !== undefined) highlighted += `<span class="token-comment">${escapeHTML(comment)}</span>`;
                else if (str !== undefined) highlighted += `<span class="token-string">${escapeHTML(str)}</span>`;
                else if (variable !== undefined) highlighted += `<span class="token-variable">${escapeHTML(variable)}</span>`;
                else if (routeKw !== undefined) highlighted += `<span class="token-route">${escapeHTML(routeKw)}</span>`;
                else if (jsDecl !== undefined) highlighted += `<span class="token-keyword">${escapeHTML(jsDecl)}</span>`;
                else if (tagKeyword !== undefined) highlighted += `<span class="token-keyword">${escapeHTML(tagKeyword)}</span>`;
                else if (htmlAttrs !== undefined) highlighted += `<span class="token-attr">${escapeHTML(htmlAttrs)}</span>`;
                else if (dotStyle !== undefined) highlighted += `<span class="token-dot-style">${escapeHTML(dotStyle)}</span>`;
                else if (funcCall !== undefined) highlighted += `<span class="token-func">${escapeHTML(funcCall)}</span>`;
                else if (propName !== undefined) highlighted += `<span class="token-css-prop">${escapeHTML(propName)}</span>`;
                else if (concatOp !== undefined) highlighted += `<span class="token-operator">${escapeHTML(concatOp)}</span>`;
                else if (cssVal !== undefined) highlighted += `<span class="token-css-val">${escapeHTML(cssVal)}</span>`;
                else if (symbol !== undefined) highlighted += `<span class="token-bracket">${escapeHTML(symbol)}</span>`;
                else highlighted += escapeHTML(fullMatch);

                lastIndex = tokenRegex.lastIndex;
            }

            if (lastIndex < code.length) highlighted += escapeHTML(code.substring(lastIndex));

            highlightingContent.innerHTML = highlighted + "\n";
            updateCursorStats();
        }

        function insertSnippet(type) {
            let snippet = '';
            if (type === 'pageParam') snippet = '\npage = novaPagina(parametro) {\n  div {\n    h1 = "Bem-vindo " + $parametro\n  }\n}\n';
            if (type === 'popupSnippet') snippet = '\npopup = meuModal {\n  div {\n    h2 = "Título do Popup"\n  }\n}\n';
            if (type === 'onclickPlace') snippet = 'onclick.place: {\n  div {\n    p = "Opção 1"\n  }\n}';
            if (type === 'constSnippet') snippet = '\nconst = nometravado = "Valor Fixo"\n';

            const cursorPos = editing.selectionStart;
            editing.value = editing.value.substring(0, cursorPos) + snippet + editing.value.substring(cursorPos);
            updateEditor();
            editing.focus();
        }

        function handleKeyDown(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = editing.selectionStart;
                const end = editing.selectionEnd;
                editing.value = editing.value.substring(0, start) + "  " + editing.value.substring(end);
                editing.selectionStart = editing.selectionEnd = start + 2;
                updateEditor();
            }
        }

        // --- COMPILADOR SUBSCRIPT 2.9.2 (PAGES COM PARÂMETROS E PLACE FIX) ---
        function parseSubScriptToHTML(subscriptCode) {
            let headContent = '';
            let styleCSS = '';
            let globalScripts = '';
            let elementCounter = 0;

            let pagesMap = {};
            let popupMap = {};

            function convertExpression(expr) {
                if (!expr) return '""';
                return expr.replace(/\$([a-zA-Z0-9_]+)/g, '$1');
            }

            let code = subscriptCode;

            // Extrair Páginas com parâmetros: page = rota(param1, param2) { ... }
            const pageRegex = /page\s*=\s*([a-zA-Z0-9_]+)\s*\(([^)]*)\)\s*\{([\s\S]*?)\n\}/g;
            let pMatch;
            let firstPageName = null;
            while ((pMatch = pageRegex.exec(code)) !== null) {
                let pageRoute = pMatch[1].trim();
                let params = pMatch[2].split(',').map(s => s.trim()).filter(Boolean);
                if (!firstPageName) firstPageName = pageRoute;
                let pageInnerBlock = pMatch[3].trim();
                pagesMap[pageRoute] = { params: params, body: pageInnerBlock };
            }
            code = code.replace(pageRegex, '');

            // Extrair Popups: popup = popup-name { ... }
            const popupRegex = /popup\s*=\s*([a-zA-Z0-9_\-]+)\s*\{([\s\S]*?)\n\}/g;
            let popMatch;
            while ((popMatch = popupRegex.exec(code)) !== null) {
                let popupName = popMatch[1].trim();
                let popupInnerBlock = popMatch[2].trim();
                popupMap[popupName] = popupInnerBlock;
            }
            code = code.replace(popupRegex, '');

            // Parser de Árvore DOM
            function parseSubScriptTree(inputCode) {
                let htmlOutput = '';
                let clean = inputCode.replace(/\/\/[^\n]*/g, '').trim();
                if (!clean) return '';

                const lines = clean.split('\n');
                let i = 0;

                while (i < lines.length) {
                    let line = lines[i].trim();
                    if (!line) { i++; continue; }

                    const tagMatch = line.match(/^([a-zA-Z0-9]+)(?:\s*\[([^\]]*)\])?(?:\s*=\s*([^{\n]+?))?(?:\.style)?(?:\s*\{)?$/);

                    if (tagMatch) {
                        const tagName = tagMatch[1];
                        const rawAttrs = tagMatch[2] ? tagMatch[2].trim() : '';
                        let contentExpr = tagMatch[3] ? tagMatch[3].trim() : null;
                        const hasBrace = line.endsWith('{');

                        if (contentExpr && contentExpr.endsWith('.style')) {
                            contentExpr = contentExpr.substring(0, contentExpr.length - 6).trim();
                        }

                        elementCounter++;
                        let elemId = `sub_${tagName}_${elementCounter}`;

                        let attrPairs = [];
                        if (rawAttrs) {
                            const attrRegex = /([a-zA-Z0-9_\-]+)\s*=\s*("([^"]*)"|'([^']*)'|([^\s,]+))/g;
                            let aMatch;
                            while ((aMatch = attrRegex.exec(rawAttrs)) !== null) {
                                const key = aMatch[1].trim();
                                const val = (aMatch[3] !== undefined ? aMatch[3] : (aMatch[4] !== undefined ? aMatch[4] : aMatch[5])).trim();
                                if (key.toLowerCase() === 'id') elemId = val;
                                else attrPairs.push(`${key}="${val}"`);
                            }
                        }

                        let cssStyles = [];
                        let onClickJS = '';
                        let onClickPlaceHTML = '';
                        let innerBodyContent = '';

                        if (hasBrace) {
                            let braceDepth = 1;
                            let blockLines = [];
                            i++;
                            while (i < lines.length && braceDepth > 0) {
                                let curLine = lines[i];
                                if (curLine.includes('{')) braceDepth++;
                                if (curLine.includes('}')) braceDepth--;
                                if (braceDepth > 0) blockLines.push(curLine);
                                i++;
                            }

                            let blockStr = blockLines.join('\n');
                            if (blockStr.includes('onclick.place:')) {
                                let placeIndex = blockStr.indexOf('onclick.place:');
                                let beforePlace = blockStr.substring(0, placeIndex);
                                let afterPlace = blockStr.substring(placeIndex + 'onclick.place:'.length).trim();

                                if (afterPlace.startsWith('{')) {
                                    let depth = 0;
                                    let placeContentEnd = -1;
                                    for (let idx = 0; idx < afterPlace.length; idx++) {
                                        if (afterPlace[idx] === '{') depth++;
                                        else if (afterPlace[idx] === '}') depth--;
                                        if (depth === 0) { placeContentEnd = idx; break; }
                                    }

                                    if (placeContentEnd !== -1) {
                                        let placeInnerBlock = afterPlace.substring(1, placeContentEnd).trim();
                                        onClickPlaceHTML = parseSubScriptTree(placeInnerBlock);
                                        let remainingAfter = afterPlace.substring(placeContentEnd + 1);
                                        blockStr = beforePlace + remainingAfter;
                                    }
                                }
                                blockLines = blockStr.split('\n').filter(Boolean);
                            }

                            let isCssBlock = blockLines.every(l => {
                                let trimmed = l.trim();
                                return !trimmed || trimmed.includes(':') || trimmed.startsWith('//');
                            });

                            if (isCssBlock) {
                                blockLines.forEach(l => {
                                    const parts = l.split(':');
                                    if (parts.length >= 2) {
                                        const key = parts[0].trim();
                                        const val = parts.slice(1).join(':').trim().replace(/;$/, '');
                                        if (key === 'onClick') onClickJS = convertExpression(val);
                                        else cssStyles.push(`${key}: ${val};`);
                                    }
                                });
                            } else {
                                innerBodyContent = parseSubScriptTree(blockLines.join('\n'));
                            }
                        } else {
                            i++;
                        }

                        let attrString = ` id="${elemId}"` + (attrPairs.length > 0 ? ' ' + attrPairs.join(' ') : '');
                        let styleAttr = cssStyles.length > 0 ? ` style="${cssStyles.join(' ')}"` : '';

                        if (onClickPlaceHTML) {
                            let encodedHTML = encodeURIComponent(onClickPlaceHTML);
                            onClickJS = `SubScript.togglePlaceMenu(event, '${encodedHTML}')`;
                        }

                        let onClickAttr = onClickJS ? ` onclick="${onClickJS.replace(/"/g, '&quot;')}"` : '';
                        let textVal = contentExpr ? convertExpression(contentExpr) : '';

                        if (tagName === 'img') htmlOutput += `<img${attrString}${styleAttr}${onClickAttr} />\n`;
                        else if (tagName === 'input') htmlOutput += `<input${attrString}${styleAttr}${onClickAttr} />\n`;
                        else htmlOutput += `<${tagName}${attrString}${styleAttr}${onClickAttr}>${textVal ? textVal : innerBodyContent}</${tagName}>\n`;
                    } else {
                        i++;
                    }
                }

                return htmlOutput;
            }

            let bodyHTML = '';

            if (Object.keys(pagesMap).length > 0) {
                bodyHTML += `<div id="subscript-app-router">\n`;
                Object.keys(pagesMap).forEach(route => {
                    let pageData = pagesMap[route];
                    let parsedContent = parseSubScriptTree(pageData.body);
                    bodyHTML += `<div id="subscript-page-${route}" class="subscript-page" data-params='${JSON.stringify(pageData.params)}' style="display: none;">\n${parsedContent}\n</div>\n`;
                });
                bodyHTML += `</div>\n`;
            }

            if (Object.keys(popupMap).length > 0) {
                bodyHTML += `<div id="subscript-popups-container">\n`;
                Object.keys(popupMap).forEach(popName => {
                    let parsedContent = parseSubScriptTree(popupMap[popName]);
                    bodyHTML += `<div id="subscript-popup-${popName}" class="subscript-popup-backdrop" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 9999; align-items: center; justify-content: center;">
                        <div class="subscript-popup-content" style="background: #1e293b; padding: 24px; border-radius: 12px; border: 1px solid #475569; position: relative; max-width: 90%; min-width: 300px;">
                            <button onclick="SubScript.closePopup('${popName}')" style="position: absolute; top: 10px; right: 12px; background: none; border: none; color: #94a3b8; font-size: 18px; cursor: pointer;">&times;</button>
                            ${parsedContent}
                        </div>
                    </div>\n`;
                });
                bodyHTML += `</div>\n`;
            }

            bodyHTML += `<div id="subscript-place-menu" style="display: none; position: fixed; z-index: 99999;"></div>`;

            return `<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    ${headContent}
    <script>
        window.SubScript = {
            currentPage: null,
            navigate: function(pageRoute) {
                var args = Array.prototype.slice.call(arguments, 1);
                var pages = document.querySelectorAll('.subscript-page');
                pages.forEach(function(p) { p.style.display = 'none'; });
                
                var target = document.getElementById('subscript-page-' + pageRoute);
                if (target) {
                    target.style.display = 'block';
                    this.currentPage = pageRoute;
                    
                    var paramNames = JSON.parse(target.getAttribute('data-params') || '[]');
                    paramNames.forEach(function(pName, idx) {
                        if (args[idx] !== undefined) {
                            window[pName] = args[idx];
                        }
                    });

                    console.log("[SubScript 2.9] Navegou para a página: " + pageRoute + (args.length ? " com parâmetros: " + args.join(', ') : ''));
                }
            },
            openPopup: function(popupName) {
                var pop = document.getElementById('subscript-popup-' + popupName);
                if (pop) {
                    pop.style.display = 'flex';
                    console.log("[SubScript 2.9] Popup aberto: " + popupName);
                }
            },
            closePopup: function(popupName) {
                var pop = document.getElementById('subscript-popup-' + popupName);
                if (pop) {
                    pop.style.display = 'none';
                    console.log("[SubScript 2.9] Popup fechado: " + popupName);
                }
            },
            togglePlaceMenu: function(event, encodedHTML) {
                if (event) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                var menu = document.getElementById('subscript-place-menu');
                if (!menu) return;

                menu.innerHTML = decodeURIComponent(encodedHTML);
                menu.style.display = 'block';
                menu.style.position = 'fixed';
                menu.style.left = (event ? event.clientX : 100) + 'px';
                menu.style.top = (event ? event.clientY : 100) + 'px';
                console.log("[SubScript 2.9] Menu flutuante exibido.");
            }
        };

        document.addEventListener('click', function(e) {
            var menu = document.getElementById('subscript-place-menu');
            if (menu && !menu.contains(e.target)) {
                menu.style.display = 'none';
            }
        });
    <\/script>
</head>
<body style="margin: 0; background-color: #0f172a;">
${bodyHTML}

<script>
    window.console.log = function(msg) {
        window.parent.postMessage({ type: 'CONSOLE_LOG', message: String(msg) }, '*');
    };

    document.addEventListener("DOMContentLoaded", function() {
        ${firstPageName ? `SubScript.navigate('${firstPageName}');` : ''}
    });
<\/script>
</body>
</html>`;
        }

        function compileAndRender() {
            const subscriptCode = editing.value;
            const fullHTML = parseSubScriptToHTML(subscriptCode);
            document.getElementById('previewFrame').srcdoc = fullHTML;
            document.getElementById('statusIndicator').innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Compilado`;
        }

        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'CONSOLE_LOG') {
                logToConsole(event.data.message, 'log');
            }
        });

        function logToConsole(message, type = 'log') {
            const entry = document.createElement('div');
            const time = new Date().toLocaleTimeString();
            entry.className = "text-amber-300 flex items-center gap-2";
            entry.innerHTML = `<span class="text-slate-500">[${time}]</span> <span>${message}</span>`;
            consoleOutput.appendChild(entry);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }

        function clearConsole() {
            consoleOutput.innerHTML = `<div class="text-slate-500 italic">// Saídas do console.log(), navegação e popups...</div>`;
        }

        function clearEditor() {
            if (confirm("Deseja realmente limpar todo o código?")) {
                editing.value = "";
                updateEditor();
                compileAndRender();
            }
        }

        function saveFile() { downloadFile(currentFileName, editing.value); }
        function saveFileAs() {
            const name = prompt("Digite o nome do arquivo:", currentFileName);
            if (name) {
                currentFileName = name.endsWith('.sub15') ? name : name + '.sub15';
                document.getElementById('fileNameText').innerText = currentFileName;
                saveFile();
            }
        }

        function exportToHTML() {
            downloadFile(currentFileName.replace('.sub15', '.html'), parseSubScriptToHTML(editing.value), 'text/html');
        }

        function downloadFile(filename, text, type = 'text/plain') {
            const element = document.createElement('a');
            element.href = URL.createObjectURL(new Blob([text], { type: type }));
            element.download = filename;
            document.body.appendChild(element);
            element.click();
            document.body.removeChild(element);
        }

        function handleFileOpen(event) {
            const file = event.target.files[0];
            if (!file) return;
            currentFileName = file.name;
            document.getElementById('fileNameText').innerText = currentFileName;
            const reader = new FileReader();
            reader.onload = function(e) {
                editing.value = e.target.result;
                updateEditor();
                compileAndRender();
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
